name: TT Elite pagination verification probe

# Diagnostic ONLY -- does not touch the production parser output. Tests
# whether the leaguesMatches rapi endpoint can be called directly (outside
# the page-hydration context) and what cursor parameter it accepts, so that
# historical-backfill pagination in the production fetch step can be built
# against a verified request shape instead of an assumed one.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run pagination probe
        run: python probe/verify_pagination.py --out probe/output/pagination_probe.json

      - name: Commit probe output
        run: |
          git config user.name "tt-elite-probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe/output/pagination_probe.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Pagination verification probe $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
